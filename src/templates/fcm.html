<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCjdIkLWB21j44CP88Z1dmbhGGjVEjF7GM",
        authDomain: "vertretungsplan-ac27a.firebaseapp.com",
        projectId: "vertretungsplan-ac27a",
        messagingSenderId: "500049181819",
        appId: "1:500049181819:web:2a3637c4f27571866636de"
    };

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    const VAPID_KEY = "BFMP4TOSFHuZIpQJ6FlMkHGdkgwEoJ_KCyN4lew3S-FxPhyXDxGbKO3yStUHSgDwlw2iTEWtBkhFKBeBUxShXIo";
    const SUBSCRIBE_URL =
        "https://us-central1-vertretungsplan-ac27a.cloudfunctions.net/subscribeToClass";
    const UNSUBSCRIBE_URL =
        "https://us-central1-vertretungsplan-ac27a.cloudfunctions.net/unsubscribeFromClass";

    async function subscribeToClass(classId) {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
            alert("Benachrichtigungsrechte abgelehnt :(");
            return;
        }

        const token = await getToken(messaging, {
            vapidKey: VAPID_KEY
        });

        await fetch(SUBSCRIBE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: token,
                classId: classId
            })
        });

        alert(`Anmeldung in der ${classId} erfolgreich!`);
    }

    window.subscribeToClass = subscribeToClass

    export async function unsubscribeFromClass(classId) {
        const token = await getToken(messaging, {
            vapidKey: VAPID_KEY
        });

        if (!token) {
            alert("fehler.");
            return;
        }

        await fetch(UNSUBSCRIBE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: token,
                classId: classId
            })
        });

        alert(`Abmeldung aus der ${classId} erfolgreich!`);
    }

    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/firebase-messaging-sw.js")
            .then((registration) => {
                console.log("SW aktiv");
            })
            .catch((err) => {
                console.error("SW Fehler:", err);
            });
    }
    window.unsubscribeFromClass = unsubscribeFromClass
</script>
