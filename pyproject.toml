[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "S602",
    "RUF012",
    "TRY003",
    "TRY301",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",

    "D",
    "TC",
    "ERA",
    "FBT",
    "COM",
    "CPY",
    "EM",
    "INT",
    "RSE",
    "RET",
    "SLF",
    "FLY",
    "C90",
    "PGH",
]

[project]
name = "vertretungsplan"
version = "1.3.1"
description = "Ein besserer Vertretungsplan für das JRG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "croniter>=6.0.0",
    "gitpython>=3.1.45",
    "minify-html>=0.18.1",
]

[dependency-groups]
dev = ["line-profiler>=5.0.0", "pyrefly>=0.42.2", "ruff>=0.14.5"]

[tool.pyrefly]
untyped-def-behavior = "check-and-infer-return-any"

[tool.pyrefly.errors]
implicit-any = "error"
