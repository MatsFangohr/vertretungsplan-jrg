[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[project]
name = "vertretungsplan"
version = "1.1.0"
description = "Ein besserer Vertretungsplan für das JRG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.13.2", "croniter>=6.0.0", "minify-html>=0.18.1"]

[dependency-groups]
dev = ["line-profiler>=5.0.0", "pyrefly>=0.42.2", "ruff>=0.14.5"]

[tool.pyrefly]
untyped-def-behavior = "check-and-infer-return-any"

[tool.pyrefly.errors]
implicit-any = "error"
