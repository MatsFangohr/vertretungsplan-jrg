[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[project]
name = "vertretungsplan"
version = "1.1.0"
description = "Ein besserer Vertretungsplan für das JRG."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.0.0",
    "minify-html>=0.18.1",
    "requests>=2.32.5",
    "requests-cache>=1.2.1",
]
